<div class="cart">

    <form #FormRegister="ngForm" (submit)="onSubmit(FormRegister)">
        <div class="field form-control">
            <label>Full Name</label>
            <input pInputText type="text" [(ngModel)]="User.FullName" #FullName="ngModel">
          @if( FullName.invalid ){
             <small style="color: red;">Full Name is required</small>
          }
        </div>
    </form>
</div>
